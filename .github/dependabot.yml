# Dependency updates for a published package: its dependency tree ships to
# every consumer, so a CVE in a transitive dependency is a consumer problem.
#
# Grouping is deliberate. This is a small repo with a small review pool, so
# minor/patch bumps arrive as one PR per ecosystem per week instead of one per
# dependency. Major bumps stay ungrouped and individual — those are the ones
# that need a real read.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # TypeScript 7 is the native compiler and ships no JS compiler API.
      # `@hey-api/openapi-ts` (codegen) and `src/sdk/routerErrors.test.ts`
      # (`ts.transpileModule`) both need that API, so stay on 6.x until they
      # support 7. Lift this when they do.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    ignore:
      # NEVER let Dependabot bump the Comfy-Org/github-workflows reusables: a caller
      # pins them TWICE (`uses:` SHA + `workflows_ref:` input) and Dependabot only
      # rewrites `uses:`, splitting the pair. The bump-*-callers fleet in
      # github-workflows moves both pins together. Both entries are needed:
      # Dependabot names a reusable by its FULL path, and a bare `dependency-name`
      # is an exact match (the exact form covers `owner/repo`, the `/*` form the
      # per-file names). Do NOT collapse to `Comfy-Org/github-workflows*`.
      #
      # No `versions:` or `update-types:` on purpose -- the ignore is TOTAL,
      # security advisories included. That is not an oversight to narrow later:
      # the problem is not which versions Dependabot picks, it is that it
      # cannot move this dependency correctly at ALL, so a security bump would
      # split the pair exactly like a routine one. The upstream bump-*-callers
      # fleet is what moves these pins, and scripts/check-workflow-pins.mjs
      # fails CI if the pair is ever split again -- by Dependabot, or by hand.
      #
      # Both entries are spelled in CANONICAL case, and that is load-bearing:
      # Dependabot matches `dependency-name` against the name exactly as it is
      # written in `uses:`, while GitHub itself resolves owner/repo
      # case-insensitively. A caller spelled `comfy-org/github-workflows` would
      # therefore run fine and slip straight past these two ignores. What keeps
      # that from happening is the other half of the defence: lint (4) in
      # scripts/check-workflow-pins.mjs rejects any non-canonical spelling, so
      # the only callers that can exist are ones these entries cover. Do not
      # relax that lint without widening the spellings here to match.
      - dependency-name: "Comfy-Org/github-workflows"
      - dependency-name: "Comfy-Org/github-workflows/*"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
