# Dependency updates for a published package: its dependency tree ships to
# every consumer, so a CVE in a transitive dependency is a consumer problem.
#
# Grouping is deliberate. This is a small repo with a small review pool, so
# minor/patch bumps arrive as one PR per ecosystem per week instead of one per
# dependency. Major bumps stay ungrouped and individual — those are the ones
# that need a real read.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # TypeScript 7 is the native compiler and ships no JS compiler API.
      # `@hey-api/openapi-ts` (codegen) and `src/sdk/routerErrors.test.ts`
      # (`ts.transpileModule`) both need that API, so stay on 6.x until they
      # support 7. Lift this when they do.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    ignore:
      # NEVER let Dependabot bump the Comfy-Org/github-workflows reusables: a caller
      # pins them TWICE (`uses:` SHA + `workflows_ref:` input) and Dependabot only
      # rewrites `uses:`, splitting the pair. The bump-*-callers fleet in
      # github-workflows moves both pins together. Dependabot names a reusable by
      # its FULL path and a bare `dependency-name` is an exact match, so the
      # globbed per-file form below is the one that covers these callers. Do NOT
      # widen it to `Comfy-Org/github-workflows*`, and do not re-add a bare
      # `Comfy-Org/github-workflows` beside it -- see the note further down for
      # why that entry was dropped rather than kept as belt-and-braces.
      #
      # No `versions:` or `update-types:` on purpose -- the ignore is TOTAL,
      # security advisories included. That is not an oversight to narrow later:
      # the problem is not which versions Dependabot picks, it is that it
      # cannot move this dependency correctly at ALL, so a security bump would
      # split the pair exactly like a routine one. The upstream bump-*-callers
      # fleet is what moves these pins, and scripts/check-workflow-pins.mjs
      # fails CI if the pair is ever split again -- by Dependabot, or by hand.
      #
      # Case does NOT have to match, and an earlier version of this comment was
      # wrong to say it did. Dependabot compares `dependency-name` using
      # `Dependabot::Config::UpdateConfig.wildcard_match?`, which lowercases BOTH
      # the pattern and the candidate before matching, so this canonical-case
      # entry already covers a caller spelled `comfy-org/github-workflows`.
      # Lint (4) in scripts/check-workflow-pins.mjs still requires the canonical
      # spelling, but as hygiene -- one name across the caller, this entry and
      # the freshness watchdog -- not because a lowercase caller would escape
      # here. Relaxing that lint does not open a hole in this ignore.
      #
      # The entry is scoped to `.github/workflows/*` rather than a bare `/*`.
      # The bare glob also swallowed STEP-level composite actions from this
      # same repo (`Comfy-Org/github-workflows/actions/foo@<sha>`), which carry a
      # single pin with no `workflows_ref:` partner -- nothing for Dependabot to
      # split, so nothing to ignore. Ignoring them would have frozen them
      # SILENTLY: check-workflow-pins.mjs skips step-level `uses:` by design, and
      # the freshness watchdog only watches cursor-review.yml, so no alarm covers
      # them. Reusable workflows can only live under `.github/workflows/`, so
      # narrowing loses no coverage of the pin-pair this block exists to protect.
      #
      # A BARE `Comfy-Org/github-workflows` entry used to sit above this one and
      # has been dropped, because that narrowing's own reasoning condemns it. By
      # this block's premise -- Dependabot names a reusable by its FULL path --
      # the only `uses:` a bare exact match can name is repo-ROOT
      # `Comfy-Org/github-workflows@<sha>`, a composite action carrying a single
      # pin with no `workflows_ref:` partner. That is the same shape the glob was
      # just narrowed to stop swallowing, for the same reason: no pair to split,
      # and freezing it would be silent, since neither check-workflow-pins.mjs
      # nor the cursor-review.yml watchdog looks at it. This repo has no such
      # root-action `uses:` today, so the entry was dead as written; if one is
      # ever added it should be bumped, not frozen.
      #
      # If the premise is ever wrong and Dependabot does name the reusable
      # barely, its bump lands as a SPLIT pin and check-workflow-pins.mjs fails
      # CI on the Dependabot PR -- loud, on a PR nobody has merged. That is the
      # direction to err in against a silent freeze nothing reports at all.
      - dependency-name: "Comfy-Org/github-workflows/.github/workflows/*"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
